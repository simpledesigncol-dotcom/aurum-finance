<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="goldH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8A5408"/>
      <stop offset="18%" stop-color="#C78919"/>
      <stop offset="38%" stop-color="#EEC552"/>
      <stop offset="50%" stop-color="#FFF6D5"/>
      <stop offset="62%" stop-color="#F3CF6C"/>
      <stop offset="80%" stop-color="#D49A29"/>
      <stop offset="100%" stop-color="#8A5408"/>
    </linearGradient>

    <linearGradient id="goldHInv" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8A5408"/>
      <stop offset="25%" stop-color="#D49A29"/>
      <stop offset="45%" stop-color="#F3CF6C"/>
      <stop offset="52%" stop-color="#FFF6D5"/>
      <stop offset="62%" stop-color="#EEC552"/>
      <stop offset="82%" stop-color="#C78919"/>
      <stop offset="100%" stop-color="#8A5408"/>
    </linearGradient>

    <linearGradient id="goldV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF7DA"/>
      <stop offset="15%" stop-color="#F4D06C"/>
      <stop offset="45%" stop-color="#C48718"/>
      <stop offset="75%" stop-color="#9A5E0A"/>
      <stop offset="100%" stop-color="#6A3D00"/>
    </linearGradient>

    <radialGradient id="glow" cx="52%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowSm" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shadowInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4A2800" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shadowVert" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3D1F00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3D1F00" stop-opacity="0"/>
    </linearGradient>

    <!-- Left wing group (to be mirrored) -->
    <g id="wing-upper">
      <path d="M-88,0 C-82,-38 -32,-72 38,-40 C68,-24 88,-8 88,0 C88,8 68,24 38,40 C-32,72 -82,38 -88,0 Z" fill="url(#goldH)"/>
      <path d="M-70,0 C-65,-28 -25,-54 30,-30 C55,-18 70,-6 70,0 C70,6 55,18 30,30 C-25,54 -65,28 -70,0 Z" fill="url(#shadowInner)"/>
      <path d="M-60,0 C-55,-22 -20,-42 25,-24 C45,-14 60,-5 60,0 C60,5 45,14 25,24 C-20,42 -55,22 -60,0 Z" fill="url(#glow)"/>
      <path d="M-88,0 C-82,-38 -32,-72 38,-40 C68,-24 88,-8 88,0 C88,8 68,24 38,40 C-32,72 -82,38 -88,0 Z" fill="none" stroke="#FFF0C7" stroke-width="1.5" stroke-opacity="0.85"/>
    </g>

    <g id="wing-mid">
      <path d="M-65,0 C-60,-28 -22,-55 28,-32 C50,-18 65,-6 65,0 C65,6 50,18 28,32 C-22,55 -60,28 -65,0 Z" fill="url(#goldHInv)"/>
      <path d="M-50,0 C-45,-20 -16,-38 22,-22 C38,-12 50,-4 50,0 C50,4 38,12 22,22 C-16,38 -45,20 -50,0 Z" fill="url(#shadowInner)"/>
      <path d="M-42,0 C-38,-16 -14,-32 18,-18 C32,-10 42,-3 42,0 C42,3 32,10 18,18 C-14,32 -38,16 -42,0 Z" fill="url(#glowSm)"/>
      <path d="M-65,0 C-60,-28 -22,-55 28,-32 C50,-18 65,-6 65,0 C65,6 50,18 28,32 C-22,55 -60,28 -65,0 Z" fill="none" stroke="#FFF0C7" stroke-width="1.3" stroke-opacity="0.75"/>
    </g>

    <g id="wing-low">
      <path d="M-75,0 C-70,-18 -25,-42 35,-24 C58,-13 75,-4 75,0 C75,4 58,13 35,24 C-25,42 -70,18 -75,0 Z" fill="url(#goldH)"/>
      <path d="M-55,0 C-50,-13 -18,-30 25,-18 C42,-10 55,-3 55,0 C55,3 42,10 25,18 C-18,30 -50,13 -55,0 Z" fill="url(#shadowInner)"/>
      <path d="M-45,0 C-40,-10 -14,-22 20,-14 C34,-8 45,-3 45,0 C45,3 34,8 20,14 C-14,22 -40,10 -45,0 Z" fill="url(#glowSm)"/>
      <path d="M-75,0 C-70,-18 -25,-42 35,-24 C58,-13 75,-4 75,0 C75,4 58,13 35,24 C-25,42 -70,18 -75,0 Z" fill="none" stroke="#FFF0C7" stroke-width="1.3" stroke-opacity="0.75"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#0A0A0A"/>

  <!-- Subtle background glow -->
  <ellipse cx="250" cy="240" rx="180" ry="140" fill="url(#glow)" opacity="0.08"/>

  <!-- CENTRAL DIAMOND (back layer) -->
  <g transform="translate(250, 315)">
    <path d="M0,-78 L28,-58 L24,38 L0,78 L-24,38 L-28,-58 Z" fill="url(#goldV)"/>
    <path d="M0,-78 L28,-58 L24,38 L0,78 L-24,38 L-28,-58 Z" fill="url(#shadowVert)"/>
    <path d="M0,-58 L18,-44 L15,28 L0,58 L-15,28 L-18,-44 Z" fill="url(#glowCenter)"/>
    <path d="M0,-78 L28,-58 L24,38 L0,78 L-24,38 L-28,-58 Z" fill="none" stroke="#FFF0C7" stroke-width="1.5" stroke-opacity="0.85"/>
    <!-- Subtle sparkle at top -->
    <ellipse cx="0" cy="-60" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- LEFT SIDE WINGS -->
  <g id="left-wings">
    <!-- Lower wing -->
    <g transform="translate(185, 280) rotate(-12)">
      <use href="#wing-low"/>
    </g>
    <!-- Middle wing -->
    <g transform="translate(128, 228) rotate(-8)">
      <use href="#wing-mid"/>
    </g>
    <!-- Upper wing -->
    <g transform="translate(138, 148) rotate(-18)">
      <use href="#wing-upper"/>
    </g>
  </g>

  <!-- RIGHT SIDE WINGS (mirrored) -->
  <g id="right-wings">
    <use href="#left-wings" transform="translate(500, 0) scale(-1, 1)"/>
  </g>
</svg>
